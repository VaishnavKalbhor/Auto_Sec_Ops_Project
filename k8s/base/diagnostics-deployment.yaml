apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostics-service
  namespace: autosecureops
  labels:
    app: diagnostics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diagnostics-service
  template:
    metadata:
      labels:
        app: diagnostics-service
    spec:
      serviceAccountName: autosecureops-service-account
      containers:
        - name: diagnostics-service
          image: autosecureops/diagnostics-service:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

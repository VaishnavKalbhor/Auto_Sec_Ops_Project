# Default-deny: with no other policy selecting a pod, all ingress traffic to
# every pod in the namespace is blocked. Everything below this file is an
# explicit allow list on top of that default-deny baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: autosecureops
spec:
  podSelector: {}
  policyTypes:
    - Ingress

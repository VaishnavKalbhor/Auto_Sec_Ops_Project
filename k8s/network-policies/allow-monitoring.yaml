# Allow monitoring traffic (e.g. Prometheus) to reach the /metrics endpoint
# of each service. Scoped to a namespace labeled for monitoring rather than
# opening the port to the whole cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: autosecureops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - telemetry-service
          - vehicle-registry-service
          - diagnostics-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000

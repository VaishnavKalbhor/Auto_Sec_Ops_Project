{{- range .Values.services }}
{{- $svc := . }}
{{- $root := $.Values }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $root.namespace }}
  labels:
    app: {{ $svc.name }}
spec:
  selector:
    app: {{ $svc.name }}
  ports:
    - port: {{ $root.service.port }}
      targetPort: {{ $root.service.targetPort }}
  type: ClusterIP
---
{{- end }}

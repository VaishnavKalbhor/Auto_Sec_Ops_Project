name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - telemetry-service
          - vehicle-registry-service
          - diagnostics-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          pytest -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: test-services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies for all services
        run: |
          pip install -r services/telemetry-service/requirements.txt
          pip install -r services/vehicle-registry-service/requirements.txt
          pip install -r services/diagnostics-service/requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/integration -v

  build-images:
    runs-on: ubuntu-latest
    needs: test-services
    strategy:
      matrix:
        service:
          - telemetry-service
          - vehicle-registry-service
          - diagnostics-service
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t autosecureops/${{ matrix.service }}:ci services/${{ matrix.service }}

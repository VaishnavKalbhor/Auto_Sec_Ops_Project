name: Deploy (dev)

on:
  workflow_dispatch:

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests (dry-run, client-side)
        run: |
          kubectl apply --dry-run=client -f k8s/base/ -R

      - name: Lint Helm chart
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint helm/autosecureops
